<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollie Fleet</title>
  <link rel="icon" href="/fleet/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/fleet/icon-192.png">
  <link rel="stylesheet" href="/fleet/css/base.css?v=2.10.0">
  <link rel="stylesheet" href="/fleet/css/components.css?v=2.10.0">
</head>
<body>
  <!-- Login view (shown when not authenticated) -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <!-- Firebase sign-in -->
      <div id="login-pane" hidden>
        <div class="login-card__header">
          <div class="login-card__title">Ollie Fleet</div>
          <div class="login-card__subtitle">Sign in with your UNDER account</div>
        </div>
        <div class="login-card__form">
          <div id="login-alert" hidden></div>
          <button class="btn btn--primary btn--full" id="firebase-signin-btn">
            Sign in with Google
          </button>
          <p style="text-align: center; margin-top: 1rem; color: var(--color-muted); font-size: 0.875rem;">
            Your email must be authorized by an administrator.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- App shell (shown when authenticated) -->
  <div id="app-shell" class="shell" hidden>
    <!-- Sidebar navigation -->
    <nav class="sidebar">
      <div class="sidebar__logo">Ollie Fleet</div>
      <nav class="sidebar__nav" id="sidebar-nav"></nav>
      <div class="sidebar__footer" id="sidebar-footer"></div>
    </nav>

    <!-- Top bar -->
    <header class="topbar">
      <span class="topbar__title" id="topbar-title">Loads</span>
      <div class="topbar__actions">
        <span class="refresh-indicator" id="refresh-indicator"></span>
        <div class="topbar__controls" id="topbar-controls"></div>
      </div>
    </header>

    <!-- Main content area -->
    <main class="content" id="main-content">
      <div class="state-loading"><div class="spinner"></div></div>
    </main>
  </div>

  <script type="module" src="/fleet/app.js?v=2.10.0"></script>
</body>
</html>
